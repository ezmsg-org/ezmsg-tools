[project]
name = "ezmsg-tools"
description = "ezmsg namespace package containing tools for working with ezmsg graphs."
authors = [
  { name = "Chadwick Boulay", email = "chadwick.boulay@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "ezmsg>=3.6.2",
  "numpy>=1.26.0",
  "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "scipy>=1.14.1",
    "ezmsg-sigproc>=2.36.0",
    "ezmsg-simbiophys>=1.8.0",
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "ruff>=0.12.9",
]
test = [
    "pytest>=8.3.3",
    "ezmsg-simbiophys>=1.4.1",
]
docs = [
  "sphinx>=7.0",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "pydata-sphinx-theme",
  "myst-parser",
]

[project.optional-dependencies]
perfmon = [
    "dash-extensions>=1.0.19",
    "dash>=2.18.2",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "typer>=0.15.1",
    "pygtail>=0.14.0",
    "dash-bootstrap-components>=1.6.0",
    "ezmsg-baseproc>=1.1.0",
]
# NOTE: ezmsg.tools.plot needs phosphor's envelope support, set_channel_labels,
# set_channel_labels_visible and SweepConfig.max_fps. Bump this floor to the
# release that carries them before publishing.
sigmon = [
    "PySide6>=6.7",
    "pygraphviz>=1.14",
    "typer>=0.15.1",
    "ezmsg-qt>=0.2.1",
    "phosphor>=0.5.0",
    "pandas",
]
viewer = [
    "PySide6>=6.7",
    "typer>=0.15.1",
    "ezmsg-qt>=0.2.1",
    "phosphor>=0.5.0",
]

[project.scripts]
ezmsg-performance-monitor = "ezmsg.tools.perfmon.cli:main"
ezmsg-signal-monitor = "ezmsg.tools.sigmon.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ezmsg/tools/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmsg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
# Exclude auto-generated files
exclude = ["*/__version__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["ezmsg.tools"]
known-third-party = ["ezmsg"]

[tool.uv.sources]
# Local path sources are a developer convenience and must not be committed: CI
# has no sibling checkouts, so a path here fails resolution for every job,
# including ones that never touch the package (`uv sync --only-group docs`).
# Add them locally with `uv add ../phosphor --editable --frozen` and drop the
# change before committing.
# Uncomment to use development version of ezmsg from git
#ezmsg = { git = "https://github.com/ezmsg-org/ezmsg.git", branch = "dev" }
